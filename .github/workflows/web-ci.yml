name: Web CI

on:
  pull_request:
    paths:
      - 'bondex-notch-web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'bondex-notch-web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bondex-notch-web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bondex-notch-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity dependency findings
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test
